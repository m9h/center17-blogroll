# GitLab Pages for the river and calendar. The job rebuilds the outputs itself
# (same build.py as the GitHub Action) so a scheduled pipeline keeps the river
# fresh without depending on GitHub. On a plain push it also rebuilds.
pages:
  stage: deploy
  image: python:3.12-alpine
  script:
    - python3 build.py
    - mkdir -p public
    - cp index.html river.xml events.html events.ics blogroll.opml public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
