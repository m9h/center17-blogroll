name: Rebuild blogroll and river
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["feeds.py", "events.py", "build.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build.py
      - name: Commit outputs
        run: |
          git config user.name "center17-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A blogroll.opml README.md ghost-page.html validation.json index.html river.xml events.ics events.html
          git diff --cached --quiet || git commit -m "Rebuild river $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
